<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>资源中控台 · 飞书资源管理</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#resources" data-nav="resources">
      <span class="logo">R</span><span><b>资源中控台</b><small>RESOURCE HUB</small></span>
    </a>
    <nav id="nav">
      <span class="nav-label">资源</span>
      <button data-page="home"><span class="nav-ico">⌂</span><span>工作台</span></button>
      <button class="active" data-page="resources"><span class="nav-ico">▦</span><span>资源库</span></button>
      <span class="nav-label">发布平台</span>
      <button data-quick-filter="xiaohongshu"><span class="nav-ico">🍠</span><span>小红书</span><b class="nav-count" data-count="xiaohongshu"></b></button>
      <button data-quick-filter="xianyu"><span class="nav-ico">🐟</span><span>闲鱼</span><b class="nav-count" data-count="xianyu"></b></button>
      <button data-quick-filter="twitter"><span class="nav-ico">𝕏</span><span>X</span><b class="nav-count" data-count="twitter"></b></button>
      <span class="nav-label">网盘</span>
      <button data-quick-filter="quark"><span class="nav-ico">Q</span><span>夸克网盘</span><b class="nav-count" data-count="quark"></b></button>
      <button data-quick-filter="baidu"><span class="nav-ico">B</span><span>百度网盘</span><b class="nav-count" data-count="baidu"></b></button>
      <span class="nav-label">维护</span>
      <button data-page="health"><span class="nav-ico">♡</span><span>资源健康</span></button>
      <span class="nav-label">系统</span>
      <button data-page="connect"><span class="nav-ico">⚙</span><span>飞书连接</span></button>
    </nav>
    <div class="sideFoot"><span class="dot"></span><span id="sideStatus">尚未连接</span></div>
  </aside>
  <main>
    <header>
      <div class="breadcrumb">资源中控台 <span>/</span> <b id="pageName">资源库</b></div>
      <div class="header-actions"><span id="syncStatus" role="status"></span><button class="btn ghost" id="refresh">↻ 同步</button><button class="btn primary" data-action="new" data-kind="resources">＋ 新增资源</button></div>
    </header>
    <div id="notice" class="notice hidden" role="status"></div>
    <section id="view"></section>
    <footer>资源中控台 <span>·</span> 数据由飞书多维表格驱动</footer>
  </main>
</div>
<div id="overlay" class="overlay hidden"><section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1"></section></div>
<script src="./app.js"></script>
</body></html>
