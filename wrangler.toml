name = "virtual-resource-feishu"
main = "src/worker.ts"
compatibility_date = "2026-10-30"
workers_dev = true

# 保留 Cloudflare Dashboard 手动配置的环境变量
keep_vars = true

# React/Vite 前端与 Worker 一起部署
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]